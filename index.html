<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/styles/main.scss" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header class="header">
            <img src="src/assets/logo.svg" alt="Logo" class="header__logo" />
            <nav class="header__navlinks" id="nav-links">
                <a href="#Home" class="anchor-fonts">Home</a>
                <a href="#Discover" class="anchor-fonts">Discover</a>
                <a href="#SpecialDeals" class="anchor-fonts">Special Deals</a>
                <a href="#Contact" class="anchor-fonts">Contact</a>
            </nav>
            <button class="header__menu-button">
                <img
                    src="src/assets/menu.svg"
                    alt="Menu"
                    class="header__menu-icon"
                />
            </button>
            <div class="header__button-container">
                <button class="btn-secondary header__login-btn">Log In</button>
                <button class="btn-primary header__sign-up-btn">Sign Up</button>
            </div>
        </header>
        <main>
            <section class="hero-section" id="Home">
                <div class="hero-section__glow"></div>
                <div class="hero-section__images">
                    <img
                        src="src/assets/airplanes.svg"
                        alt="airplanes"
                        class="hero-section__airplane-image"
                    />
                    <div class="hero-section__rectangles">
                        <img
                            src="src/assets/Rectangle 1.svg"
                            alt="Rectangle"
                            class="hero-section__rectangle-image1"
                        />
                        <img
                            src="src/assets/Rectangle 2.svg"
                            alt="Rectangle"
                            class="hero-section__rectangle-image2"
                        />
                        <img
                            src="src/assets/Rectangle 3.svg"
                            alt="Rectangle"
                            class="hero-section__rectangle-image3"
                        />
                    </div>
                    <img
                        src="src/assets/Frame 16.svg"
                        alt="message"
                        class="hero-section__message-icon"
                    />
                    <img
                        src="src/assets/Frame 17.svg"
                        alt="friends"
                        class="hero-section__friends-icon"
                    />
                    <img
                        src="src/assets/Frame 18.svg"
                        alt="location"
                        class="hero-section__location-icon"
                    />
                </div>
                <div class="hero-section__content">
                    <div class="hero-section__explore-icon font-color">
                        Explore the world!
                        <img
                            src="src/assets/work.svg"
                            alt="work"
                            class="hero-section__work-icon"
                        />
                    </div>
                    <h1 class="h1-fonts">
                        Travel
                        <span class="font-color">top destination</span> of the
                        world
                    </h1>
                    <p class="paragraph-fonts">
                        We always make our customer happy by providing <br />
                        as many choices as possible
                    </p>
                    <div class="hero-section__btn-container">
                        <button
                            class="hero-section__get-started-btn btn-primary"
                        >
                            Get Started
                        </button>
                        <button
                            class="hero-section__watch-demo-btn btn-secondary"
                        >
                            <img
                                src="src//assets/play-circle.5 1.svg"
                                alt="play"
                                class="hero-section__play-icon"
                            />
                            Watch Demo
                        </button>
                    </div>
                    <img
                        src="src/assets/arrows.svg"
                        alt="arrows"
                        class="hero-section__arrows-icon"
                    />
                </div>
                <div class="hero-section__companies-container">
                    <img src="src/assets/tripadvisor.svg" alt="tripadvisor" />
                    <img src="src/assets/expedia.svg" alt="expedia" />
                    <img src="src/assets/booking.svg" alt="booking" />
                    <img src="src/assets/airbnb.svg" alt="airbnb" />
                    <img src="src/assets/orbitz.svg" alt="orbitz" />
                </div>
            </section>
        </main>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
